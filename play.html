<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Battle of Banmo</title>
<link rel="icon" href="img/ui_logo.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3a2c5a">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --fg: #f2e6c8; --dim: #b8aed0; --hi: #ffd860; --ok: #6ad08a; --bad: #ff6070; --ink: #1b1630; --cs: 2; --hs: 2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--fg); font-family: "Mitr", "Thonburi", sans-serif; font-size: 14px; overflow: hidden;
         background: #3a2418 url(img/ui_table.png) 0 0 / 192px 144px repeat; image-rendering: pixelated; }
  img { image-rendering: pixelated; }
  .px-text { text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); }

  /* ---------- กรอบพิกเซล (9-slice) ---------- */
  .panel { border: 16px solid transparent; border-image: url(img/ui_panel.png) 8 fill / 16px stretch; }
  .paper { border: 16px solid transparent; border-image: url(img/ui_paper.png) 8 fill / 16px stretch; color: #2a1f1a; }
  button { font: inherit; font-weight: 500; color: #fff; cursor: pointer; padding: 3px 12px; min-height: 36px; background: none;
           border: 10px solid transparent; border-image: url(img/ui_btn_purple.png) 5 fill / 10px stretch;
           text-shadow: 0 2px 0 var(--ink); }
  button.main { border-image-source: url(img/ui_btn_gold.png); }
  button:hover:not(:disabled) { filter: brightness(1.15); }
  button:active:not(:disabled) { transform: translateY(2px); }
  button:disabled { filter: grayscale(.8) brightness(.7); cursor: default; }
  select, input { font: inherit; padding: 5px 8px; background: #2a2244; color: var(--fg); border: 2px solid var(--ink); box-shadow: inset 0 2px 0 #0006; border-radius: 0; }

  /* ---------- การ์ด ---------- */
  .card { --s: var(--cs); position: relative; width: calc(64px * var(--s)); height: calc(96px * var(--s)); flex: none;
          background-size: 100% 100%; filter: drop-shadow(0 4px 4px #000a); transition: transform .12s; }
  .card > * { position: absolute; }
  .u { --x: 0; --y: 0; --w: 0; --h: 0; left: calc(var(--x) * 1px * var(--s)); top: calc(var(--y) * 1px * var(--s));
       width: calc(var(--w) * 1px * var(--s)); height: calc(var(--h) * 1px * var(--s)); }
  .name { display: flex; align-items: center; justify-content: flex-start; padding-left: calc(1.5px * var(--s)); color: #2a1f1a; font-weight: 500; white-space: nowrap; overflow: hidden; line-height: 1; }
  .badge { display: flex; align-items: center; justify-content: center; background-size: 100% 100%;
           font-family: "Press Start 2P", monospace; color: #fff; text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); }
  .badge.power { justify-content: flex-start; align-items: flex-start; padding: calc(7.9px * var(--s)) 0 0 calc(7px * var(--s)); }
  .badge.power.two { padding-left: calc(3.8px * var(--s)); }
  .badge.up { color: var(--ok); } .badge.down { color: #ff8a8a; }
  .art { display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  .noart { color: #fff8; font-size: 12px; align-items: center; text-align: center; }
  .type { display: flex; align-items: center; justify-content: flex-start; color: #fff; white-space: nowrap; overflow: hidden; }
  .text { color: #2a1f1a; line-height: 1.25; padding: 2px 4px; overflow: hidden; }
  .text .spacer { float: right; width: 0; height: calc(var(--sh, 8px) * var(--s)); }
  .text .dodge { float: right; clear: right; width: calc(var(--dw, 12px) * var(--s)); height: calc(var(--dh, 10px) * var(--s)); }   /* เว้นที่ให้ดาบ power มุมล่างขวา */
  .text .lspacer { float: left; width: 0; height: calc(var(--lsh, 8px) * var(--s)); }
  .text .ldodge { float: left; clear: left; width: calc(var(--ldw, 9px) * var(--s)); height: calc(var(--ldh, 8px) * var(--s)); }   /* เว้นที่ให้เหรียญ gem มุมล่างซ้าย */
  .name > span, .type > span { margin: 0 auto; }   /* ชื่อยาวไม่ล้นซ้ายใต้เหรียญ cost (ล้นขวาแทน → fitCard ย่อให้พอดี) */
  .kw { font-weight: 500; color: #7a2a30; }
  .tag { right: calc(5px * var(--s)); top: calc(15px * var(--s)); font-size: 10px; padding: 0 4px; background: #1b1630cc; color: var(--hi); }
  .status { left: calc(4px * var(--s)); top: calc(15px * var(--s)); display: flex; gap: 2px; flex-wrap: wrap; max-width: 86%; }
  .status span { font-size: 11px; padding: 0 4px; background: #1b1630dd; color: #fff; }
  .status span.pred { background: #8a1f2bf0; font-weight: 600; font-size: 12px; }
  .card.click { cursor: pointer; }
  @media (hover: hover) { .card.click:hover { transform: translateY(-6px); } }
  .card.ready { filter: drop-shadow(0 0 5px var(--ok)) drop-shadow(0 0 2px var(--ok)); animation: ready 1.4s ease-in-out infinite; }
  @keyframes ready { 50% { filter: drop-shadow(0 0 9px var(--ok)) drop-shadow(0 0 2px var(--ok)); } }
  .card.sel { transform: translateY(-12px); filter: drop-shadow(0 0 7px var(--hi)) drop-shadow(0 0 2px var(--hi)); }
  .card.target { cursor: crosshair; filter: drop-shadow(0 0 7px var(--bad)) drop-shadow(0 0 2px var(--bad)); animation: aim .8s ease-in-out infinite; }
  @keyframes aim { 50% { transform: scale(1.04); } }
  .card.dim { opacity: .45; }
  .card.fodder { transform: translateY(-12px); filter: drop-shadow(0 0 7px #40b8d8) drop-shadow(0 0 2px #40b8d8); }
  .card.dead::after { content: "ยังไม่รองรับ"; position: absolute; left: 0; right: 0; bottom: 38%; text-align: center; font-size: 10px; background: #000b; color: #ffb0b0; }
  .card.enter { animation: enter .45s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes enter { from { transform: translateY(-40px) scale(1.25); opacity: 0; } }
  .card.shake, .shake { animation: shake .35s; }
  @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

  /* ---------- กระดาน ---------- */
  #app { display: grid; grid-template-columns: 1fr 300px; height: 100vh; height: 100dvh; }
  #board { display: flex; flex-direction: column; padding: 8px 10px; gap: 6px; overflow: hidden; min-width: 0; }
  .row { display: flex; gap: 8px; align-items: center; min-height: calc(96px * var(--cs) + 4px); }
  .field { justify-content: center; border: 12px solid transparent; border-image: url(img/ui_panel.png) 8 / 12px stretch;
           background: url(img/ui_felt.png) 0 0 / 32px 32px; background-clip: padding-box; padding: 4px; }
  .slot { width: calc(64px * var(--cs)); height: calc(96px * var(--cs)); flex: none; background: url(img/ui_slot.png) center / 100% 100% no-repeat; opacity: .8; }
  .hand { justify-content: safe center; overflow-x: auto; overflow-y: visible; padding: 14px 4px 4px; scrollbar-width: thin; min-height: calc(96px * var(--hs) + 20px); }
  .hand .card { --s: var(--hs); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 0 4px; min-height: 30px; border: 10px solid transparent;
         border-image: url(img/ui_panel.png) 8 fill / 10px stretch; flex-wrap: wrap; }
  .bar .who { font-weight: 600; }
  .hearts { display: inline-flex; gap: 3px; }
  .hearts img { width: 22px; height: 18px; }
  .face { padding: 2px 6px; border: 2px solid transparent; }
  .face.target { border-color: var(--bad); cursor: crosshair; background: #ff607033; animation: aim .8s ease-in-out infinite; }
  .pile { display: inline-flex; align-items: center; gap: 4px; color: var(--dim); font-size: 13px; cursor: help; }
  .pile img { width: 18px; height: 21px; }
  .grow { flex: 1; }
  #msg { min-height: 24px; color: var(--hi); text-align: center; font-weight: 500; }
  #msg.err { color: #ff9aa6; }
  .opp-hand { display: inline-flex; gap: 2px; }
  .opp-hand i { width: 14px; height: 20px; background: url(img/ui_deck.png) center / 100% 100% no-repeat; }
  #paybox { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
  #abil { display: inline-flex; gap: 6px; flex-wrap: wrap; } #abil button { border-image-source: url(img/ui_btn_gold.png); font-size: 13px; }
  .opp-hand b { margin-left: 4px; font-family: "Press Start 2P"; font-size: 13px; color: #fff; }

  /* ---------- หน้าจัดเดค ---------- */
  #builder { position: fixed; inset: 0; z-index: 16; display: grid; grid-template-columns: 1fr 340px; gap: 8px; padding: 8px;
             background: url(img/ui_table.png) 0 0 / 192px 144px; }
  #builder[hidden] { display: none; }
  .bleft { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
  .bfilters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 0 4px; }
  .bfilters input { flex: 1 1 160px; } .bfilters select { flex: 0 1 auto; max-width: 180px; }
  #bgrid { flex: 1; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; justify-content: center; padding: 12px 4px; }
  #bgrid .card { --s: 1.7; }
  #bgrid .card .incount { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-family: "Press Start 2P"; font-size: 18px; color: var(--hi);
                          background: #1b1630e0; padding: 6px 8px; pointer-events: none; }
  #bgrid .card.maxed { filter: grayscale(.6) brightness(.8); }
  #bmore { align-self: center; }
  #bdeck { display: flex; flex-direction: column; min-height: 0; padding: 0 4px; }
  #bdeck h3 { margin: 0 0 6px; color: var(--hi); font-size: 17px; text-shadow: 0 2px 0 var(--ink); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  #bdeck label { display: flex; gap: 6px; align-items: center; margin: 4px 0; } #bdeck label input, #bdeck label select { flex: 1; min-width: 0; }
  #dcount { font-family: "Press Start 2P"; font-size: 14px; } #dcount.ok { color: var(--ok); }
  #dstats { font-size: 12.5px; color: var(--dim); margin: 2px 0 6px; }
  #dlist { flex: 1; overflow-y: auto; margin: 4px 0; background: #0003; padding: 2px; }
  .drow { display: flex; align-items: center; gap: 6px; padding: 2px 4px; font-size: 13px; cursor: pointer; }
  .drow:nth-child(odd) { background: #ffffff0a; }
  .drow .dc { width: 22px; height: 22px; flex: none; display: flex; align-items: center; justify-content: center; font-family: "Press Start 2P"; font-size: 9px;
              background: url(img/badge_cost.png) center / 100% 100%; color: #fff; text-shadow: 0 1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 -1px 0 var(--ink); }
  .drow .dc.spell { background: none; color: var(--dim); text-shadow: none; font-family: inherit; font-size: 11px; }
  .drow .dn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drow .dk { font-family: "Press Start 2P"; font-size: 10px; color: var(--hi); }
  .drow button { min-height: 0; padding: 0 6px; border-width: 6px; border-image-width: 6px; line-height: 1; }
  #bdeck .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; } #bdeck .btns button { flex: 1 1 45%; }
  #bmsg { min-height: 20px; color: var(--hi); font-size: 13px; text-align: center; }
  #bmsg.err { color: #ff9aa6; }
  #bdecktoggle { display: none; }
  /* ===== หน้าจัดเดคใหม่ ===== */
  .bfilters #bclose { flex: none; }
  .racetabs, .costtabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .racetabs button { width: 56px; height: 54px; min-height: 0; padding: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10.5px; line-height: 1.1; }
  .racetabs button img { width: 34px; image-rendering: pixelated; }
  .racetabs button.all { font-size: 13px; }
  .racetabs button.on, .costtabs button.on { border-image-source: url(img/ui_btn_gold.png); color: #1b1630; transform: translateY(-2px); }
  .costtabs button { width: 40px; height: 40px; min-height: 0; padding: 0; font-family: "Press Start 2P"; font-size: 11px; justify-content: center; }
  #bgrid .card { --s: var(--bs, 1.7); }
  #bgrid .card:hover { z-index: 2; transform: translateY(-6px) scale(1.04); }
  .dhead { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .dheroimg { width: 74px; height: 74px; min-height: 0; padding: 0; flex: none; position: relative; background: #2a2244; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  .dheroimg img { width: 56px; image-rendering: pixelated; }
  .dheroimg span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; background: #1b1630c0; }
  .dheadr { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .dprog { position: relative; height: 22px; background: #1b1630; box-shadow: 0 0 0 2px #0008; margin: 2px 0 8px; }
  .dbar { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#e0b040, #a87020); transition: width .2s; }
  .dbar.full { background: linear-gradient(#7ae09a, #3a9a5a); }
  .dprog span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "Press Start 2P"; font-size: 11px; color: #fff; text-shadow: 0 2px 0 #1b1630; }
  #dcount.ok { color: #fff; }
  .dcurve { display: flex; gap: 4px; align-items: flex-end; height: 64px; padding: 0 2px; margin-bottom: 4px; }
  .dcurve div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 10px; color: var(--dim); }
  .dcurve i { display: block; width: 100%; background: linear-gradient(#ffd860, #c88e2a); box-shadow: 0 0 0 1px #1b1630; min-height: 2px; transition: height .2s; }
  .dcurve b { font-family: "Press Start 2P"; font-size: 8px; color: var(--fg); margin-bottom: 2px; }
  /* แถบการ์ดในเดค: สีเผ่า + รูปจาง ๆ ทางขวา */
  .drow { position: relative; height: 32px; padding: 0 8px 0 4px; margin: 3px 0; overflow: hidden; background: linear-gradient(90deg, var(--rc) 0%, #2a2244 70%) !important;
          box-shadow: 0 0 0 2px #1b1630, inset 0 2px 0 #ffffff22; transition: transform .1s; }
  .drow:hover { transform: translateX(-4px); }
  .drow .dthumb { position: absolute; right: 26px; top: -18px; width: 64px; height: 64px; image-rendering: pixelated; opacity: .55; pointer-events: none;
                  -webkit-mask-image: linear-gradient(90deg, transparent, #000 50%); mask-image: linear-gradient(90deg, transparent, #000 50%); }
  .drow .dn { position: relative; font-weight: 600; text-shadow: 0 1px 0 #1b1630, 0 0 4px #1b1630; color: #fff; }
  .drow .dk { position: relative; min-width: 26px; text-align: center; background: #1b1630d0; padding: 3px 4px; }
  .drow .dz { position: relative; min-height: 0; width: 24px; height: 24px; padding: 0; font-size: 12px; }
  .drow.pop { animation: rowpop .3s; }
  @keyframes rowpop { 0% { transform: translateX(-12px); filter: brightness(1.8); } }
  .flyto { position: fixed; z-index: 90; pointer-events: none; transition: transform .35s cubic-bezier(.5, 0, .7, .4), opacity .35s; }
  .heropick { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-height: 50vh; overflow-y: auto; padding: 6px; }
  .heropick button { width: 76px; height: 86px; min-height: 0; padding: 2px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; font-size: 10px; line-height: 1.1; }
  .heropick button img { width: 52px; image-rendering: pixelated; }
  .heropick button.on { border-image-source: url(img/ui_btn_gold.png); color: #1b1630; }
  @media (max-width: 799px) { .racetabs, .costtabs { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; padding-bottom: 4px; } .racetabs button, .costtabs button { flex: none; }
    .racetabs button { width: 44px; height: 46px; font-size: 9px; } .racetabs button img { width: 26px; } .costtabs button { width: 32px; height: 32px; font-size: 9px; } }
  .deckrow { display: flex; gap: 8px; align-items: center; } .deckrow select { flex: 1; min-width: 0; }
  @media (max-width: 799px) {
    #builder { grid-template-columns: 1fr; padding: 4px; }
    #bgrid .card { --s: 1.25; } #bgrid { gap: 6px; }
    #bdeck { position: fixed; left: 4px; right: 4px; bottom: 4px; max-height: 70vh; z-index: 2; transform: translateY(calc(100% - 64px)); transition: transform .2s; }
    #bdeck.open { transform: none; }
    #bdecktoggle { display: inline-block; }
    .bleft { padding-bottom: 64px; }
  }

  #side { display: flex; flex-direction: column; overflow: hidden; margin: 8px 8px 8px 0; }
  #preview { display: flex; justify-content: center; padding: 6px; min-height: calc(96px * 3.4 + 12px); }
  #preview .card { --s: 3.4; }
  #log { flex: 1; overflow-y: auto; padding: 4px 6px; font-size: 12.5px; line-height: 1.5; color: var(--fg); }
  #log div.turn { color: var(--hi); margin-top: 6px; font-weight: 500; }
  #logbtn { display: none; }

  /* ---------- หน้าต่าง / ข้อความลอย ---------- */
  .modal { position: fixed; inset: 0; background: #0009; display: flex; align-items: center; justify-content: center; z-index: 20; padding: 12px; }
  .box { max-width: 900px; max-height: 92vh; overflow: auto; padding: 4px 8px; }
  .box h2 { margin: 0 0 8px; font-weight: 600; font-size: 20px; }
  .box .cards { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 12px 0; }
  .box .btns { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .muted { color: var(--dim); font-size: 13px; }
  /* ตัวละครขยับ: หายใจ (squash) · ตัวบินลอย · โดนตีกะพริบ · แช่แข็ง */
  .field .card .art img { transform-origin: 50% 100%; animation: idle 2.2s ease-in-out infinite; }
  .field .card.flyer .art img { animation: hover 1.8s ease-in-out infinite; }
  @keyframes idle { 50% { transform: scale(1.035, .97); } }
  @keyframes hover { 50% { transform: translateY(-5%); } }
  .field .card.frozen .art img { animation: none; filter: saturate(.25) brightness(1.25) sepia(.2) hue-rotate(170deg); }
  .field .card .art img.hurtflash { animation: hurtflash .35s; }
  @keyframes hurtflash { 0%, 60% { filter: brightness(4) saturate(0); transform: translateX(6%); } 100% { filter: none; } }
  #app.quake { animation: quake .4s; }
  @keyframes quake { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(6px, -3px); } 60% { transform: translate(-4px, -2px); } 80% { transform: translate(3px, 2px); } }
  .fly { position: fixed; z-index: 31; pointer-events: none; width: 46px; height: 69px; image-rendering: pixelated; }
  .fly.card { width: auto; height: auto; }
  .pfx { position: absolute; image-rendering: pixelated; pointer-events: none; }
  .powpop { position: absolute; font-family: "Press Start 2P"; font-size: 24px; pointer-events: none; animation: powpop .9s ease-out forwards; }
  @keyframes powpop { 0% { transform: translate(-50%, 0) scale(.5); opacity: 0; } 25% { transform: translate(-50%, -14px) scale(1.3); opacity: 1; } 100% { transform: translate(-50%, -46px) scale(1); opacity: 0; } }
  .leader-scene { position: fixed; inset: 0; z-index: 27; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; pointer-events: none;
                  background: radial-gradient(circle, #fff8 0%, #ffd86055 25%, #1b1630e0 70%); animation: leader 1.5s ease-out forwards; }
  .leader-scene .card { --s: 3.6; animation: leadercard 1.5s cubic-bezier(.2, 1.3, .4, 1) forwards; }
  .leader-scene b { font-size: 30px; color: var(--hi); }
  @keyframes leader { 0% { opacity: 0; } 10% { opacity: 1; background-color: #fff; } 80% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes leadercard { 0% { transform: scale(.2) rotate(-20deg); } 40% { transform: scale(1.1) rotate(3deg); } 60%, 100% { transform: scale(1) rotate(0); } }
  .endfade { position: fixed; inset: 0; z-index: 19; background: #000; pointer-events: none; animation: endfade 1.2s forwards; }
  @keyframes endfade { to { opacity: .65; } }
  .fxlayer { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
  .fx { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; }
  .fx.hit { animation: hit .4s ease-out forwards; }
  @keyframes hit { from { transform: scale(.3) rotate(-20deg); } 50% { transform: scale(1.3); } to { transform: scale(1.1) rotate(15deg); opacity: 0; } }
  .fx.puff { width: 90px; height: 90px; margin: -45px 0 0 -45px; animation: puff .6s ease-out forwards; }
  @keyframes puff { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.6) translateY(-20px); opacity: 0; } }
  .ghost { position: absolute; animation: ghost .55s ease-in forwards; }
  @keyframes ghost { to { transform: scale(.6) rotate(-8deg); opacity: 0; filter: brightness(3) grayscale(1); } }
  .float { position: absolute; font-family: "Press Start 2P"; font-size: 20px; color: #ff7080; animation: float 1s ease-out forwards; }
  @keyframes float { to { transform: translateY(-40px); opacity: 0; } }

  .xp-sec { margin-top: 6px; padding-top: 4px; border-top: 1px solid #ffffff22; color: var(--dim); font-size: 12px; }

  /* ---------- สอนเล่น ---------- */
  #tutor { position: fixed; inset: 0; z-index: 17; display: flex; align-items: center; justify-content: center; padding: 12px;

  .tstep .ttext h2 { margin: 0 0 8px; font-size: 24px; color: var(--hi); text-shadow: 0 2px 0 var(--ink); }

         display: flex; align-items: center; justify-content: center; border: 2px solid var(--ink); box-shadow: 0 2px 0 var(--ink); z-index: 2; }
  .pinlist { counter-reset: n; padding-left: 0; list-style: none; margin: 6px 0; }
  .pinlist li { margin: 3px 0; } .pinlist li::before { counter-increment: n; content: counter(n); display: inline-flex; width: 22px; height: 22px; margin-right: 8px;
         border-radius: 50%; background: var(--bad); color: #fff; font-size: 12px; font-weight: 600; align-items: center; justify-content: center; border: 2px solid var(--ink); }

  .arrow { font-size: 34px; color: var(--hi); text-shadow: 0 2px 0 var(--ink); }

  .kwtable td:first-child { color: var(--hi); font-weight: 600; white-space: nowrap; }

  @keyframes hintin { from { transform: translate(-50%, -14px); opacity: 0; } }

  /* ================= โต๊ะเกม (2026-11-17) ================= */
  #board { position: relative; display: grid; grid-template-rows: auto auto 1fr auto 1fr auto auto auto; gap: 4px; padding: 6px 110px 0 12px;
           background: radial-gradient(ellipse 70% 55% at 50% 50%, #3a2c5ad0, #3a2c5a40 70%, transparent 72%); }
  .opphand { height: 44px; display: flex; justify-content: center; align-items: flex-start; position: relative; }
  .opphand img { width: 34px; height: 51px; margin: 0 -9px; transform-origin: 50% -150%; filter: drop-shadow(0 2px 2px #0008); }
  .opphand b { position: absolute; right: calc(50% - 150px); top: 8px; font-family: "Press Start 2P"; font-size: 12px; }
  .herorow { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; min-height: 92px; }
  .herorow .piles { display: flex; gap: 10px; align-items: center; justify-self: end; flex-wrap: wrap; }
  .herorow .piles.right { justify-self: start; }
  .hero { position: relative; width: 92px; height: 92px; }
  .hero .portrait { width: 100%; height: 100%; border: 12px solid transparent; border-image: url(img/ui_panel.png) 8 fill / 12px stretch;
                    display: flex; align-items: flex-end; justify-content: center; overflow: hidden; background: #2a2244; }
  .hero .portrait img { width: 64px; image-rendering: pixelated; animation: idle 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
  .hpgem { position: absolute; right: -14px; bottom: -6px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
           font-family: "Press Start 2P"; font-size: 15px; color: #fff; background: url(img/ui_heart.png) center / 100% 100% no-repeat; }
  .heroname { position: absolute; left: 50%; top: -10px; transform: translateX(-50%); white-space: nowrap; font-size: 13px; font-weight: 600; background: #1b1630d0; padding: 0 6px; }
  .hero.target { cursor: crosshair; filter: drop-shadow(0 0 8px var(--bad)) drop-shadow(0 0 2px var(--bad)); animation: aim .8s ease-in-out infinite; }
  .hero.droptarget { filter: drop-shadow(0 0 12px #ff3040) drop-shadow(0 0 3px #ff3040); transform: scale(1.08); }
  .row.field { min-height: calc(50px * var(--ms) + 26px); border: none; background: none; padding: 0; gap: calc(6px * var(--ms)); }
  .row.field .slot { display: none; }
  #msg { min-height: 22px; }
  .actionbar { position: relative; z-index: 90; display: flex; justify-content: center; align-items: center; gap: 8px; min-height: 0; flex-wrap: wrap; }   /* อยู่เหนือการ์ดในมือที่ยกขึ้น */
  .actionbar #paybox:not(:empty) { background: #1b1630e8; padding: 4px 10px; box-shadow: 0 0 0 2px #e0b040; }
  .actionbar:empty { display: none; }
  /* มอนบนสนาม: กรอบเล็ก (รูป + power + สถานะ) */
  .card.minion { --s: var(--ms); width: calc(56px * var(--ms)); height: calc(50px * var(--ms)); background: none !important; filter: drop-shadow(0 4px 3px #000a); }
  .card.minion .m-art { position: absolute; inset: 0 0 calc(6px * var(--ms)) 0; border-radius: calc(5px * var(--ms)); overflow: hidden;
                        background-size: calc(64px * var(--ms)) calc(96px * var(--ms)); background-position: calc(-4px * var(--ms)) calc(-14px * var(--ms));
                        box-shadow: 0 0 0 3px var(--rc, #8a7a6a), 0 0 0 5px #1b1630; }
  .card.minion .m-art .art { position: absolute; inset: 0; width: auto; height: auto; }
  /* power บนกรอบมอน: วงกลมเลขใหญ่ + ดาบเล็ก */
  .card.minion .m-pow { position: absolute; right: calc(-5px * var(--ms)); bottom: calc(-3px * var(--ms)); width: calc(17px * var(--ms)); height: calc(17px * var(--ms));
                        border-radius: 50%; background: #2a1f1a; box-shadow: 0 0 0 2px #e0b040, 0 0 0 4px #1b1630; display: flex; align-items: center; justify-content: center; }
  .card.minion .m-pow img { position: absolute; left: -45%; top: -45%; width: 80%; opacity: .95; }
  .card.minion .m-pow b { font-family: "Press Start 2P"; font-size: calc(6px * var(--ms)); color: #fff; text-shadow: 0 2px 0 #1b1630; }
  .card.minion .m-pow.up b { color: var(--ok); } .card.minion .m-pow.down b { color: #ff8a8a; }
  .card.minion .status { left: calc(-3px * var(--ms)); top: calc(-7px * var(--ms)); max-width: 120%; }
  .card.minion.guard .m-art { box-shadow: 0 0 0 3px var(--rc), 0 0 0 7px #e0b040, 0 0 0 9px #1b1630; }
  .card.minion.stealth .m-art { opacity: .55; box-shadow: 0 0 0 3px #ffffff60, 0 0 0 5px #1b1630; }
  .card.minion.dshield .m-art::after { content: ""; position: absolute; inset: 0; background: radial-gradient(#ffe08a00 55%, #ffe08a90); animation: dshield 1.6s ease-in-out infinite; }
  @keyframes dshield { 50% { opacity: .5; } }
  .card.minion.sel { transform: translateY(-10px) scale(1.06); }
  .card.minion.droptarget { transform: scale(1.1); filter: drop-shadow(0 0 12px #ff3040); }
  /* มือแบบพัด */
  .row.hand { position: relative; display: block; overflow: visible; height: calc(96px * var(--hs) * .78); min-height: 0; padding: 0; margin-top: 4px; }
  .row.hand .card { position: absolute; bottom: calc(-96px * var(--hs) * .2); transform-origin: 50% 120%;
                    transform: translateY(var(--dy, 0)) rotate(var(--rot, 0deg)); transition: transform .15s, filter .15s; }
  .row.hand .card:hover, .row.hand .card.lift { transform: translateY(-38%) scale(1.22) rotate(0deg); z-index: 60 !important; }
  .row.hand .card.sel, .row.hand .card.fodder { transform: translateY(-12%) rotate(0deg); z-index: 55 !important; }
  .row.hand .card.dragging { opacity: .25; }
  .dragghost { position: fixed; z-index: 70; pointer-events: none; transform: translate(-50%, -60%) rotate(-4deg) scale(1.05); filter: drop-shadow(0 12px 10px #000c); }
  /* ปุ่มจบเทิร์น + เวลาเทิร์น */
  #endturn { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 84px; height: 84px; border-radius: 50%; border: none; padding: 0;
             background: conic-gradient(#ffd860 var(--left, 360deg), #3a2c5a 0) ; box-shadow: 0 0 0 4px #1b1630, 0 6px 0 #1b1630; font-size: 16px; }
  #endturn span { display: flex; align-items: center; justify-content: center; position: absolute; inset: 6px; border-radius: 50%; background: #c88e2a; line-height: 1.1; }
  #endturn:disabled span { background: #5a4a6a; }
  #endturn.ready span { animation: endready 1s ease-in-out infinite; }
  @keyframes endready { 50% { background: #e8b040; box-shadow: 0 0 16px #ffd860; } }
  .arrow-svg { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 65; display: none; }
  .arrow-svg.on { display: block; }

  /* ================= ไฮไลต์ (เด่นขึ้น) ================= */
  .card .hl { position: absolute; inset: calc(-3px * var(--s)); border-radius: calc(4px * var(--s)); pointer-events: none; z-index: 3; }
  .card.playable .hl { border: 4px solid #6ad08a; box-shadow: 0 0 14px 3px #6ad08acc, inset 0 0 10px #6ad08a88; animation: hlpulse 1.1s ease-in-out infinite; }
  .card.sel .hl { border: 5px solid #ffd860; box-shadow: 0 0 22px 6px #ffd860dd, inset 0 0 14px #ffd86099; }
  .card.fodder .hl { border: 5px solid #40d0ff; box-shadow: 0 0 20px 5px #40d0ffcc, inset 0 0 12px #40d0ff88; }
  .card.target .hl { border: 5px solid #ff4058; box-shadow: 0 0 22px 6px #ff4058dd; animation: hlpulse .7s ease-in-out infinite; }
  @keyframes hlpulse { 50% { box-shadow: 0 0 26px 8px var(--hlc, #6ad08acc), inset 0 0 14px var(--hlc, #6ad08a88); opacity: .75; } }
  .card.target .hl { --hlc: #ff4058; } .card.playable .hl { --hlc: #6ad08a; }
  .row.hand .card.unplayable { filter: brightness(.7) saturate(.7) drop-shadow(0 4px 4px #000a); }
  .pick-tag { position: absolute; left: 50%; top: calc(-6px * var(--s)); transform: translateX(-50%); z-index: 4; white-space: nowrap; pointer-events: none;
              font-weight: 600; font-size: 14px; padding: 2px 10px; color: #1b1630; box-shadow: 0 0 0 2px #1b1630, 0 3px 0 #1b1630; }
  .pick-tag.sum { background: #ffd860; } .pick-tag.pay { background: #40d0ff; } .pick-tag.mull { background: #ff9a60; }
  /* มอนบนสนาม: กรอบเรืองแทน drop-shadow */
  .card.minion.ready .m-art { box-shadow: 0 0 0 3px var(--rc), 0 0 0 7px #6ad08a, 0 0 18px 8px #6ad08acc; animation: readypulse 1.1s ease-in-out infinite; }
  @keyframes readypulse { 50% { box-shadow: 0 0 0 3px var(--rc), 0 0 0 7px #6ad08a, 0 0 28px 12px #6ad08a; } }
  .card.minion.sel .m-art { box-shadow: 0 0 0 3px var(--rc), 0 0 0 8px #ffd860, 0 0 26px 10px #ffd860dd; }
  .card.minion.target .m-art { box-shadow: 0 0 0 3px var(--rc), 0 0 0 8px #ff4058, 0 0 26px 10px #ff4058dd; animation: targetpulse .7s ease-in-out infinite; }
  @keyframes targetpulse { 50% { box-shadow: 0 0 0 3px var(--rc), 0 0 0 10px #ff4058, 0 0 34px 14px #ff4058; } }
  .card.minion.ready, .card.minion.sel, .card.minion.target { filter: drop-shadow(0 4px 3px #000a); animation: none; }
  .card.minion .hl { display: none; }

  /* ---------- จอแคบ / มือถือ ---------- */
  /* ================= UX รอบ 2: โต๊ะเต็มจอ ================= */
  #app { grid-template-columns: 1fr; }
  #side { position: fixed; right: 0; top: 0; bottom: 0; width: min(340px, 88vw); margin: 0; z-index: 85; transform: translateX(105%); transition: transform .2s; }
  #side.open { transform: none; box-shadow: -10px 0 30px #000a; }

  #preview { position: fixed; left: 16px; top: 50%; transform: translateY(-50%); z-index: 80; pointer-events: none; display: none; min-height: 0; padding: 0;
             filter: drop-shadow(0 14px 18px #000c); animation: pvin .12s ease-out; }
  #preview.on { display: flex; }
  #preview .card { --s: var(--pv, 3); }
  @keyframes pvin { from { opacity: 0; transform: translate(-10px, -50%); } }
  @media (max-width: 999px) { #preview { display: none !important; } }
  @media (min-width: 1700px) and (min-height: 561px) { #endturn { right: calc(50% - 760px); } }   /* จอกว้างมาก: ปุ่มจบเทิร์นไม่ไปไกลขอบ */
  #menubtn { display: none; }

  /* ================= พรมสนาม (ภาพพิกเซล ui_mat) ================= */
  #board { background: radial-gradient(ellipse 85% 75% at 50% 50%, transparent 55%, #0000008c); }
  .mat { position: absolute; left: var(--matx, 8%); right: var(--matx, 8%); top: var(--mt, 30%); height: var(--mh, 40%); z-index: -1;
         border: 48px solid transparent; border-image: url(img/ui_mat.png) 16 / 48px round; background: #534369 url(img/ui_felt.png) 0 0 / 48px 48px; background-blend-mode: soft-light;

  /* ================= แถบประวัติ + โชว์การ์ดศัตรู ================= */

  #hist .hi { position: relative; width: 54px; height: 54px; background: #2a2244 center / cover; box-shadow: 0 0 0 3px var(--hc), 0 0 0 5px #1b1630, 0 4px 6px #000a;

  #board { padding-left: max(110px, 84px); }

  /* ================= สกิล: ป้ายชื่อ + เส้นแสง ================= */
  .skilltag { position: fixed; z-index: 34; pointer-events: none; transform: translate(-50%, -100%); white-space: nowrap; padding: 3px 10px; font-size: 14px; font-weight: 600;
              color: #1b1630; background: linear-gradient(#ffe590, #e0b040); box-shadow: 0 0 0 2px #1b1630, 0 3px 0 #1b1630, 0 0 14px #ffd86099; animation: skilltag 1.1s ease-out forwards; }

  const h = $(mine ? "mface" : "eface"), r = h.getBoundingClientRect(); if (!r.width) return;
  for (const old of document.querySelectorAll(`.bubble.${mine ? "me" : "op"}`)) old.remove();
  const b = document.createElement("div"); b.className = `bubble ${mine ? "me" : "op top"}`; b.textContent = t;
  b.style.left = r.right + 8 + "px"; b.style.top = (mine ? r.top - 44 : r.bottom + 14) + "px";
  document.body.appendChild(b); setTimeout(() => b.remove(), 2700); SFX.play("click");
}
function sendEmote(k) {
  if (Date.now() - emoLast < 1500) return; emoLast = Date.now();          // กันกดรัว
  showEmote(true, k);
  if (conn && conn.open && (role === "host" || role === "guest")) conn.send({ type: "emote", k });
  else if (role === "bot" && Math.random() < 0.6) setTimeout(() => showEmote(false, k === 0 ? 0 : k === 1 || k === 2 ? 2 : 1), 900 + Math.random() * 800);   // บอทตอบ
}

// ---------- ต่อห้องใหม่เมื่อหลุด
// เพื่อนมี token ประจำตัว (เก็บใน sessionStorage ของแท็บ) — เจ้าของห้องรับคนเดิมกลับเข้าเกมเดิมได้
// ตรวจการเชื่อมต่อด้วย ping ทุก 4 วิ ถ้าเงียบเกิน 12 วิ ถือว่าหลุด (PeerJS บางครั้งไม่แจ้ง close)
const NET = { token: null, code: null, lastSeen: 0, hb: 0, logs: [], askP: null, retry: 0, answer: null, askOpen: false };
const sstore = { get: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} }, del: (k) => { try { sessionStorage.removeItem(k); } catch {} } };
const forgetRoom = () => sstore.del("room");
function netWait(text) {

  if (!m) {
    m = document.createElement("div"); m.id = "netwait"; m.className = "modal";
    m.innerHTML = `<div class="box panel" style="text-align:center"><h2 class="px-text">การเชื่อมต่อหลุด</h2><p id="netwaittext"></p><div class="btns"><button id="netleave">ออกจากห้อง</button></div></div>`;
    m.querySelector("#netleave").onclick = () => { forgetRoom(); location.href = location.pathname; };
    document.body.appendChild(m);
  }
  m.querySelector("#netwaittext").textContent = text;
}
const netWaitOff = () => { const m = document.getElementById("netwait"); if (m) m.remove(); };
function heartbeat(c) {
  clearInterval(NET.hb); NET.lastSeen = Date.now();
  NET.hb = setInterval(() => {
    if (conn !== c) return clearInterval(NET.hb);
    if (c.open) try { c.send({ type: "ping" }); } catch {}
    if (Date.now() - NET.lastSeen > 12000) { clearInterval(NET.hb); try { c.close(); } catch {} if (conn === c) { conn = null; role === "host" ? hostLost() : guestLost(); } }
  }, 4000);
}

async function hostRoom() {
  if (typeof deckSpec($("mydeck").value) === "string") { peer = null; return netmsg(esc(deckSpec($("mydeck").value))); }
  role = "host"; remember();
  try { await loadPeer(); } catch (e) { peer = null; return netmsg(esc(e.message)); }
  const code = newCode();
  netmsg("กำลังสร้างห้อง…");
  peer = new Peer(PREFIX + code);
  peer.on("open", () => {
    const link = `${location.origin}${location.pathname}?room=${code}`;
    if (location.hash === "#nethost") parent.postMessage({ code }, "*");
    netmsg(roomShareHtml(code, link)); wireRoomShare(code, link);
  });
  peer.on("disconnected", () => { try { peer.reconnect(); } catch {} });   // เน็ตเจ้าของห้องหลุด: จองรหัสห้องเดิมกลับคืน
  peer.on("error", (e) => { if (e.type === "unavailable-id" && !S) { peer.destroy(); hostRoom(); } else if (!S) netmsg(`เชื่อมต่อไม่ได้: ${esc(e.type)}`); });
  peer.on("connection", (c) => {
    c.on("data", (d) => hostData(c, d));
    c.on("close", () => { if (conn === c) { conn = null; hostLost(); } });
  });
}
function hostData(c, d) {
  if (!d || typeof d !== "object") return;
  if (c === conn) NET.lastSeen = Date.now();
  if (d.type === "ping") return c.open && c.send({ type: "pong" });
  if (d.type === "pong") return;
  if (d.type === "emote") return Number.isInteger(d.k) && showEmote(false, d.k);
  if (d.type === "hello") {
    if (S) {                                                            // เกมกำลังเล่นอยู่: รับเฉพาะเพื่อนคนเดิมกลับเข้ามา
      if (!d.token || d.token !== NET.token) { c.send({ type: "full" }); setTimeout(() => c.close(), 500); return; }
      if (conn && conn !== c) try { conn.close(); } catch {}
      conn = c; heartbeat(c); netWaitOff();
      c.send({ type: "resume", logs: NET.logs }); S.push(); console.log("RESUME host turn " + S.G.turn);
      if (NET.askP) c.send({ type: "ask", p: NET.askP });
      toast(`${guestName} กลับเข้าห้องแล้ว`); return;
    }
    if (conn && conn !== c && conn.open) { c.send({ type: "full" }); setTimeout(() => c.close(), 500); return; }
    const deck = checkRemoteDeck(d.deck);
    if (typeof deck === "string") { c.send({ type: "reject", s: deck }); setTimeout(() => c.close(), 500); return; }
    conn = c; NET.token = String(d.token || ""); heartbeat(c);
    guestName = String(d.name || "ผู้เล่น 2").slice(0, 16); if (guestName === myName()) guestName += " (2)";
    newSession(["local", "remote"], [myName(), guestName], [deckSpec($("mydeck").value), deck]);
    return;
  }
  if (c !== conn) return;
  if (d.type === "rematch" && S && S.phase === "over") {
    const deck = checkRemoteDeck(d.deck);
    if (typeof deck === "string") return c.send({ type: "err", s: deck });
    rematch.guest = deck; rematchStatus(); tryRematch();
  } else if (d.type === "act" && S) S.act(1, d.a).then((err) => err && c.open && c.send({ type: "err", s: err }));

let tutI = 0;
function showTut(i) {
  tutI = Math.max(0, Math.min(TUT.length - 1, i)); const st = TUT[tutI];
  $("tstep").innerHTML = `<div class="tstep"><div class="tpic${st.big ? " big" : ""}"></div><div class="ttext"><h2>${tutI + 1}. ${st.h}</h2>${st.t}</div></div>`;
  for (const el of st.pic()) $("tstep").querySelector(".tpic").appendChild(el);
  $("tdots").innerHTML = TUT.map((_, k) => `<i class="${k === tutI ? "on" : ""}" data-k="${k}"></i>`).join("");
  $("tprev").disabled = tutI === 0; $("tnext").textContent = tutI === TUT.length - 1 ? "ฝึกเล่นเลย" : "ถัดไป";
  requestAnimationFrame(() => { for (const c of $("tstep").querySelectorAll(".card")) fitCard(c); });
}
$("opentutor").onclick = () => { $("title").style.display = "none"; $("tutor").hidden = false; showTut(0); };
$("tclose").onclick = () => { $("tutor").hidden = true; $("title").style.display = ""; };
$("tprev").onclick = () => showTut(tutI - 1);
$("tnext").onclick = () => { if (tutI < TUT.length - 1) showTut(tutI + 1); else { $("tutor").hidden = true; $("title").style.display = ""; $("practice").click(); } };
$("tdots").onclick = (e) => { if (e.target.dataset.k) showTut(+e.target.dataset.k); };

// โหมดฝึกเล่น: เล่นกับบอทตามปกติ แต่เด้งคำแนะนำครั้งแรกที่เจอแต่ละสถานการณ์
let HINTS = false; const hintSeen = new Set();
function hint(key, html) {
  if (!HINTS || hintSeen.has(key) || window.AUTOPLAY) return;
  hintSeen.add(key); const old = document.querySelector(".hint"); if (old) old.remove();
  const d = document.createElement("div"); d.className = "hint paper";
  d.innerHTML = `${html}<div class="btns"><button id="hintoff">ปิดคำแนะนำทั้งหมด</button><button class="main" id="hintok">เข้าใจแล้ว</button></div>`;
  d.querySelector("#hintok").onclick = () => d.remove();
  d.querySelector("#hintoff").onclick = () => { HINTS = false; d.remove(); };
  document.body.appendChild(d);
}
function hints() {
  if (!HINTS || !V) return;
  if (V.phase === "mull" && !V.mullDone) return hint("mull", "<b>เลือกการ์ดที่จะเปลี่ยน</b> — แตะการ์ดที่ไม่อยากได้ แล้วกดปุ่มเปลี่ยน · แนะนำเก็บมอนสเตอร์ cost ต่ำ 1–2 ใบไว้ลงต้นเกม");
  if (V.phase === "over") return;
  if (!V.myTurn) { if (V.opp.field.length && V.me.hp < 5) hint("hp", "เสีย HP เมื่อศัตรูตีผู้เล่นตอน<b>สนามเราว่าง</b> — วางมอนสเตอร์ไว้กันไว้เสมอ"); return; }
  if (mode === "pay") return hint("pay", "การ์ด<b>ขอบฟ้า</b>คือการ์ดที่จะทิ้งจ่าย gem (เกมเลือกตัวที่คุ้มสุดให้) · แตะเพื่อเลือก/ยกเลิก · gem พอแล้วกด <b>อัญเชิญ</b>");
  if (mode === "attack" && V.opp.field.some((x) => V.me.field.filter((y) => !y.atkErr).every((y) => y.power < x.power + (x.armor || 0))) && V.me.field.filter((y) => !y.atkErr).length > 1)
    return hint("gang", "ศัตรูตัวใหญ่เกินจะตีเดี่ยว? แตะ<b>มอนเรืองเขียวตัวอื่นเพิ่ม</b>เพื่อ<b>รุมตีรวม power</b> — ชนะแล้วเป้าจะฆ่ากลับ 1 ตัว");
  if (mode === "attack") return hint("aim", "เป้าที่ตีได้มี<b>ขอบแดง</b> พร้อมป้ายบอกผล เช่น “4 vs 3: ชนะ” · ถ้าสนามศัตรูว่าง ให้แตะ/ลากไปที่<b>รูปพระเอกศัตรู</b>");
  if ((V.me.abilities || []).some((a) => !a.err)) hint("abil", "มีปุ่ม <b>✦ สกิล</b> ขึ้นที่แถบล่าง — การ์ดบางใบมีสกิลที่กดใช้เองได้ เช่น ฟื้นคืนจากสุสาน");
  if (V.me.field.some((x) => !x.atkErr)) return hint("ready", "มอนสเตอร์ที่<b>เรืองเขียว</b>โจมตีได้ — แตะมัน แล้วเลือกเป้าหมาย");
  if (V.me.hand.some((h) => h.costNow == null && !h.err)) hint("spell", "แตะ<b>เวทปกติ</b>เพื่อใช้ได้เทิร์นละ 1 ใบ ไม่ต้องจ่าย cost");
  if (V.me.hand.some((h) => h.costNow != null && !h.err)) return hint("summon", "ตาคุณ! แตะ<b>มอนสเตอร์ในมือ</b>เพื่ออัญเชิญ — จ่าย cost ด้วยการทิ้งการ์ดอื่นให้ gem รวมพอ");
  if (V.turn > 2) hint("end", "ทำทุกอย่างที่อยากทำแล้ว กดปุ่มกลม <b>จบเทิร์น</b> ด้านขวา (เรืองเมื่อไม่มีอะไรให้ทำแล้ว)");
}

  if (location.hash === "#tiptest") setInterval(() => { if (!document.querySelector(".tip")) go(); }, 300); else setTimeout(go, 3500);
}
if (location.hash === "#gangtest") {                                                  // ทดสอบหน้าจอตีรวม
  $("go").click(); S.act(0, { t: "mull", idx: [] });
  setTimeout(() => { const [A, B] = S.G.P; S.G.cur = 0; S.G.turn = 3; A.field.length = B.field.length = 0;
    for (const p of [3, 4]) { const u = new Engine.Unit(CARD["HUM-GEN-01"]); u.power = p; u.attacksLeft = 1; A.field.push(u); }
    const big = new Engine.Unit(CARD["HUM-KNI-10"]); B.field.push(big); S.push();
    setTimeout(() => { clickUnit(V.me.field[0]); clickUnit(V.me.field[1]); }, 400); }, 2500);
}
if (location.hash === "#dragtest") {                                                  // ทดสอบลาก: ลากมอนไปตีศัตรู + ลากการ์ดขึ้นสนาม
  $("go").click(); S.act(0, { t: "mull", idx: [] });
  setTimeout(() => {
    const [A, B] = S.G.P; S.G.cur = 0; S.G.turn = 3; S.botDelay = 1e9; A.field.length = B.field.length = 0;
    const u = new Engine.Unit(CARD["HUM-KNI-10"]); u.attacksLeft = 1; A.field.push(u); B.field.push(new Engine.Unit(CARD["HUM-GEN-01"]));
    A.hand = [CARD["NEU-SPL-16"], CARD["HUM-GEN-01"]]; S.push();
    const go = () => {                                                  // รอจนอนิเมชันต้นเกมจบและการ์ดขึ้นสนามจริง
      if (draining || $("mullscreen") || document.querySelector(".banner, .showcard") || !document.querySelector("#mfield .card") || !document.querySelector("#efield .card") || !document.querySelector('#mhand .card[data-id="NEU-SPL-16"]')) return setTimeout(go, 200);
      const fire = (type, el, x, y) => (el || window).dispatchEvent(new PointerEvent(type, { clientX: x, clientY: y, bubbles: true, pointerType: "mouse", button: 0 }));
      const mine = document.querySelector("#mfield .card"), foe = document.querySelector("#efield .card");
      const a = mine.getBoundingClientRect(), b = foe.getBoundingClientRect();
      fire("pointerdown", mine, a.x + 20, a.y + 20); fire("pointermove", null, a.x + 40, a.y - 10); fire("pointermove", null, b.x + b.width / 2, b.y + b.height / 2); fire("pointerup", null, b.x + b.width / 2, b.y + b.height / 2);
      setTimeout(() => {
        console.log("DRAG attack -> enemy field " + S.G.P[1].field.length);
        const card = document.querySelector('#mhand .card[data-id="NEU-SPL-16"]'), c = card.getBoundingClientRect();
        fire("pointerdown", card, c.x + 30, c.y + 30); fire("pointermove", null, c.x + 30, c.y - 40); fire("pointermove", null, c.x + 30, c.y - 300); fire("pointerup", null, c.x + 30, c.y - 300);
        setTimeout(() => console.log("DRAG cast -> spellUsed " + S.G.P[0].spellUsed + " hand " + S.G.P[0].hand.length), 1500);
      }, 1500);
    }; setTimeout(go, 600);
  }, 2500);
}
if (location.hash === "#endtest") {                                                    // ทดสอบ: หน้าจบเกม
  $("go").click(); S.act(0, { t: "mull", idx: [] });
  setTimeout(() => { STATS && Object.assign(STATS, { summon: 4, spell: 2, kill: 3, dealt: 5, taken: 2 }); S.G.P[1].hp = 0; S.G.winner = S.G.P[0]; S.phase = "over"; S.push(); }, 2500);
}
if (location.hash === "#mulltest") { $("go").click(); setTimeout(() => document.querySelector("#mullscreen .card").click(), 1500); }
if (location.hash === "#paytest") {                                                   // ทดสอบ: โหมดจ่าย gem (ปุ่มอัญเชิญต้องไม่ถูกการ์ดบัง)
  $("go").click(); S.act(0, { t: "mull", idx: [] });
  setTimeout(() => { const [A] = S.G.P; S.G.cur = 0; S.G.turn = 3; S.botDelay = 1e9; A.field.length = 0; A.hand = ["FIS-ANC-05", "FIS-GEN-01", "FIS-ANC-02", "FIS-ANC-12", "FIS-ANC-13", "NEU-SPL-16"].map((id) => CARD[id]); S.push();
    setTimeout(() => clickHand(V.me.hand[0], 0), 400); }, 2500);
}
if (location.hash === "#practice") { $("practice").click(); }
if (location.hash === "#builder") { openBuilder(); $("dfill").click(); document.querySelector("#fillok").click(); }   // ทดสอบหน้าจัดเดค
if (location.hash === "#demo") { $("go").click(); S.act(0, { t: "mull", idx: [] }); }   // เริ่มเกมกับบอททันที
if (location.hash === "#auto") {                                                      // บอทเล่นทั้งสองฝั่ง เพื่อดูว่าหน้าจอวาดทุกสถานะได้
  role = "bot"; newSession(["bot", "bot"], ["บอท A", "บอท B"], [ARCHS[0][0], ARCHS[20][0]], { watch: true, botDelay: 0 });
  const t = setInterval(() => { if (S.phase === "over") { clearInterval(t); console.log("AUTO_DONE turn", S.G.turn); } }, 200);
}
if (location.hash === "#watch") {                                                     // ดูบอทเล่นกันแบบมีอนิเมชัน
  role = "bot"; newSession(["bot", "bot"], ["บอท A", "บอท B"], [ARCHS[0][0], ARCHS[20][0]], { watch: true, botDelay: 350 });
}
// #nethost / #netguest: ทดสอบออนไลน์จริง — สองหน้าต่างเล่นกันเองแบบสุ่มผ่าน PeerJS แล้วรายงานผลให้หน้าแม่
let autoBusy = false;
function autoStep() {
  if (!V || autoBusy) return;
  if (V.phase === "over") {                                   // เกมแรกจบ → กดเล่นอีกตา · เกมที่สองจบ → รายงานผล
    if (window.GAMES_DONE === undefined) window.GAMES_DONE = 0;
    if (window.LAST_OVER === V) return; window.LAST_OVER = V; window.GAMES_DONE++;
    parent.postMessage({ done: role + window.GAMES_DONE, winner: V.winner, turn: V.turn, hp: [V.me.hp, V.opp.hp], deck: V.me.arch }, "*");
    if (window.GAMES_DONE === 1) setTimeout(() => { const b = document.querySelector("#rmgo"); if (b) b.click(); }, 300);
    return;
  }
  if (V.phase === "mull" && !V.mullDone) return act({ t: "mull", idx: [0] });
  // ทดสอบต่อใหม่: ?drop=guest|host → ตัดการเชื่อมต่อ 1 ครั้งกลางเกมแรก
  const DROP = new URLSearchParams(location.search).get("drop");
  if (DROP && !window.DROPPED && V.turn >= 2 && (DROP === "guest") === (role === "guest") && conn) { window.DROPPED = true; console.log("DROP " + role); try { conn.close(); } catch {} return; }
  if (!V.myTurn) return;
  const r = Math.random(), hand = V.me.hand.map((h, k) => [h, k]);
  const sum = hand.filter(([h]) => h.costNow != null && !h.err && (h.costNow === 0 || h.auto.length));
  const spells = hand.filter(([h]) => h.costNow == null && !h.err), atk = V.me.field.filter((x) => !x.atkErr);
  const one = (a) => a[Math.floor(Math.random() * a.length)];
  if (sum.length && r < 0.4) { const [h, k] = one(sum); act({ t: "summon", k, f: h.auto }); }
  else if (spells.length && r < 0.55) act({ t: "cast", k: one(spells)[1] });
  else if (atk.length && r < 0.92) { const x = one(atk); act({ t: "attack", uid: x.uid, target: one(x.targets) }); }
  else act({ t: "end" });
}
if (location.hash === "#nethost" || location.hash === "#netguest") {
  window.AUTOPLAY = true; $("myname").value = location.hash === "#nethost" ? "เจ้าของห้อง" : "เพื่อน";
  if (location.hash === "#netguest") { saveDecks([{ name: "เดคทดสอบ", ids: Engine.buildDeck(ALL, ARCHS[5][0]).map((c) => c.id) }]); refreshDeckSelects(); $("mydeck").value = "d:0"; }
  if (location.hash === "#nethost") $("host").click(); else $("join").click();
}
