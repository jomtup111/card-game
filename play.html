<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เล่นเกมการ์ด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg: #211c2e; --fg: #efe6d4; --panel: #2c2540; --line: #4a4060; --hi: #ffd860; --ok: #6ad08a; --bad: #e86070; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Mitr", "Thonburi", sans-serif; font-size: 14px; }
  button { font: inherit; background: #4a3f6a; color: var(--fg); border: 2px solid #1b1630; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  button:hover:not(:disabled) { background: #5d5085; }
  button:disabled { opacity: .45; cursor: default; }
  button.main { background: #b07a20; } button.main:hover:not(:disabled) { background: #c88e2a; }
  select, input { font: inherit; padding: 4px 6px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; }

  /* ---------- การ์ด (เหมือน cards.html) ---------- */
  .card { --s: 2; position: relative; width: calc(64px * var(--s)); height: calc(96px * var(--s)); flex: none;
          background-size: 100% 100%; image-rendering: pixelated; filter: drop-shadow(0 4px 5px #0008); transition: transform .12s; }
  .card > * { position: absolute; }
  .px { image-rendering: pixelated; }
  .u { --x: 0; --y: 0; --w: 0; --h: 0; left: calc(var(--x) * 1px * var(--s)); top: calc(var(--y) * 1px * var(--s));
       width: calc(var(--w) * 1px * var(--s)); height: calc(var(--h) * 1px * var(--s)); }
  .name { display: flex; align-items: center; justify-content: center; color: #2a1f1a; font-weight: 500; white-space: nowrap; overflow: hidden; line-height: 1; }
  .badge { display: flex; align-items: center; justify-content: center; background-size: 100% 100%;
           font-family: "Press Start 2P", monospace; color: #fff; text-shadow: 0 2px 0 #1b1630, 2px 0 0 #1b1630, -2px 0 0 #1b1630, 0 -2px 0 #1b1630; }
  .badge.power { justify-content: flex-start; align-items: flex-start; padding: calc(7.9px * var(--s)) 0 0 calc(7px * var(--s)); }
  .badge.power.two { padding-left: calc(3.8px * var(--s)); }
  .badge.up { color: var(--ok); } .badge.down { color: #ff8a8a; }
  .art { display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  .art img { width: auto; height: auto; }
  .noart { color: #fff8; font-size: 12px; align-items: center; }
  .type { display: flex; align-items: center; justify-content: center; color: #fff; white-space: nowrap; overflow: hidden; }
  .text { color: #2a1f1a; line-height: 1.25; padding: 2px 4px; overflow: hidden; }
  .text .spacer { float: right; width: 0; height: calc(9px * var(--s)); }
  .text .dodge { float: right; clear: right; width: calc(10px * var(--s)); height: calc(8.5px * var(--s)); }
  .kw { font-weight: 500; color: #7a2a30; }
  .tag { right: calc(5px * var(--s)); top: calc(15px * var(--s)); font-size: 10px; padding: 0 4px; border-radius: 3px; background: #1b1630cc; color: var(--hi); }
  .status { left: calc(5px * var(--s)); top: calc(15px * var(--s)); display: flex; gap: 2px; flex-wrap: wrap; max-width: 80%; }
  .status span { font-size: 11px; padding: 0 4px; border-radius: 3px; background: #1b1630dd; color: #fff; }
  .status span.pred { background: #7a1f2bee; font-weight: 500; }
  .back { background: repeating-linear-gradient(45deg, #3a2f5a 0 6px, #2c2446 6px 12px); border: 2px solid #1b1630; border-radius: 3px; width: 22px; height: 32px; display: inline-block; }

  /* ---------- สถานะการเลือก ---------- */
  .card.click { cursor: pointer; }
  .card.click:hover { transform: translateY(-6px); }
  .card.ready { filter: drop-shadow(0 0 6px var(--ok)) drop-shadow(0 0 2px var(--ok)); }
  .card.sel { transform: translateY(-14px); filter: drop-shadow(0 0 7px var(--hi)) drop-shadow(0 0 2px var(--hi)); }
  .card.target { cursor: crosshair; filter: drop-shadow(0 0 7px var(--bad)) drop-shadow(0 0 2px var(--bad)); }
  .card.dim { opacity: .5; }
  .card.fodder { transform: translateY(-14px); filter: drop-shadow(0 0 7px #40b8d8) drop-shadow(0 0 2px #40b8d8); }
  .card.dead::after { content: "ยังไม่รองรับ"; position: absolute; left: 0; right: 0; bottom: 38%; text-align: center; font-size: 10px; background: #000a; color: #ffb0b0; }

  /* ---------- กระดาน ---------- */
  #app { display: grid; grid-template-columns: 1fr 300px; height: 100vh; }
  #board { display: flex; flex-direction: column; padding: 10px 14px; gap: 8px; overflow: hidden; }
  .row { display: flex; gap: 8px; align-items: center; min-height: calc(96px * 2 + 4px); }
  .field { justify-content: center; background: #ffffff08; border-radius: 10px; padding: 2px 8px; }
  .slot { width: calc(64px * 2); height: calc(96px * 2); border: 2px dashed #ffffff18; border-radius: 6px; flex: none; }
  .hand { justify-content: center; }
  .bar { display: flex; align-items: center; gap: 14px; padding: 4px 8px; background: var(--panel); border-radius: 8px; }
  .bar .who { font-weight: 500; min-width: 48px; }
  .hearts { font-size: 18px; letter-spacing: 1px; }
  .face { border: 2px solid transparent; border-radius: 8px; padding: 2px 8px; }
  .face.target { border-color: var(--bad); cursor: crosshair; background: #e8607022; }
  .pile { color: #c8bce0; font-size: 13px; cursor: help; }
  .grow { flex: 1; }
  #msg { min-height: 22px; color: var(--hi); text-align: center; }
  #msg.err { color: #ff9aa6; }
  .opp-hand { display: flex; gap: 3px; }

  #side { background: #1a1626; border-left: 2px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
  #preview { display: flex; justify-content: center; padding: 10px; min-height: calc(96px * 3.6 + 20px); }
  #preview .card { --s: 3.6; }
  #log { flex: 1; overflow-y: auto; padding: 6px 10px; font-size: 12.5px; line-height: 1.5; border-top: 1px solid var(--line); }
  #log div.turn { color: var(--hi); margin-top: 6px; }

  /* ---------- หน้าต่าง ---------- */
  .modal { position: fixed; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center; z-index: 10; }
  .box { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 18px 22px; max-width: 900px; }
  .box h2 { margin: 0 0 10px; font-weight: 500; font-size: 20px; }
  .box h3 { margin: 14px 0 6px; font-weight: 500; font-size: 15px; color: var(--hi); }
  .box .cards { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 12px 0; }
  .box .btns { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .box label { display: block; margin: 8px 0; }
  .muted { color: #a89cc0; font-size: 13px; }
  .code { font-family: "Press Start 2P", monospace; font-size: 22px; color: var(--hi); letter-spacing: 4px; }
  #netmsg { margin-top: 10px; min-height: 20px; word-break: break-all; }
</style>
</head>
<body>
<div id="app">
  <div id="board">
    <div class="bar">
      <span class="who" id="ename"></span><span class="face" id="eface"><span class="hearts" id="ehp"></span></span>
      <span class="opp-hand" id="ehand"></span>
      <span class="grow"></span>
      <span class="pile" id="edeck"></span><span class="pile" id="egrave"></span><span class="muted" id="earch"></span>
    </div>
    <div class="row field" id="efield"></div>
    <div id="msg"></div>
    <div class="row field" id="mfield"></div>
    <div class="bar">
      <span class="who" id="mname"></span><span class="hearts" id="mhp"></span>
      <span class="muted" id="minfo"></span>
      <span class="grow"></span>
      <span class="pile" id="mdeck"></span><span class="pile" id="mgrave"></span>
      <span id="paybox"></span>
      <button id="cancel" style="display:none">ยกเลิก</button>
      <button class="main" id="endturn">จบเทิร์น</button>
    </div>
    <div class="row hand" id="mhand"></div>
  </div>
  <div id="side"><div id="preview"><span class="muted">ชี้การ์ดเพื่อดูขยาย</span></div><div id="log"></div></div>
</div>

<div class="modal" id="setup"><div class="box" style="width:540px">
  <h2>เริ่มเกม</h2>
  <label>ชื่อของคุณ <input id="myname" maxlength="16" placeholder="ผู้เล่น"></label>
  <label>เดคของคุณ <select id="mydeck"></select></label>
  <p class="muted">เดค 50 ใบจัดอัตโนมัติจากสายที่เลือก · HP 5 · จั่วเริ่ม 5<br>
  คลิกมอนในมือ → เลือกการ์ดที่จะทิ้งจ่าย gem → อัญเชิญ · คลิกมอนบนสนาม → คลิกเป้าหมาย</p>
  <h3>เล่นกับบอท</h3>
  <label>เดคบอท <select id="botdeck"></select> <button class="main" id="go">เริ่ม</button></label>
  <h3>เล่นกับเพื่อน (ออนไลน์)</h3>
  <div class="btns" style="justify-content:flex-start">
    <button class="main" id="host">สร้างห้อง</button>
    <input id="joincode" maxlength="5" placeholder="รหัสห้อง" style="width:110px;text-transform:uppercase">
    <button id="join">เข้าห้อง</button>
  </div>
  <div id="netmsg" class="muted"></div>
</div></div>

    ${cost !== "" ? `<div ${u(0, 0, 15, 15, "background-image:url(img/badge_cost.png)")} class="u badge${ccls}">${cost}</div>` : ""}
    ${v.gem !== "" && v.gem != null ? `<div ${u(1, 82, 13, 13, "background-image:url(img/badge_gem.png)")} class="u badge gem">${v.gem}</div>` : ""}
    ${pw !== "" ? `<div ${u(46, 79, 17, 17, "background-image:url(img/badge_power.png)")} class="u badge power${pcls}${pw.length > 1 ? " two" : ""}">${pw}</div>` : ""}
    ${v.leader ? `<div class="tag">หัวหน้า</div>` : v.onlyone ? `<div class="tag">Only One</div>` : ""}
    ${st ? `<div class="status">${st}</div>` : ""}`;
  const img = el.querySelector(".art img");
  if (img) img.onload = () => fitCard(el); else requestAnimationFrame(() => fitCard(el));
  el.addEventListener("mouseenter", () => { const p = $("preview"); p.innerHTML = ""; p.appendChild(cardEl(v, { powerNow: o.powerNow, costNow: o.costNow, status: o.status, pred: o.pred })); });
  return el;
}
function fitCard(el) {
  const S = parseFloat(getComputedStyle(el).getPropertyValue("--s"));
  const img = el.querySelector(".art img");
  if (img && img.naturalWidth) {
    const k = Math.max(1, Math.floor(Math.min(54 / img.naturalWidth, 43 / img.naturalHeight)));
    img.style.width = img.naturalWidth * k * S + "px"; img.style.height = img.naturalHeight * k * S + "px";
    img.style.marginBottom = Math.max(0, Math.min(3, 43 - img.naturalHeight * k)) * S + "px";
  }
  for (const [sel, max] of [[".name", 4.2], [".type", 3], [".text", 3.2], [".badge:not(.power)", 3.2]])
    for (const t of el.querySelectorAll(sel)) {
      let f = max * S; t.style.fontSize = f + "px";
      while (f > 5 && (t.scrollWidth > t.clientWidth + 1 || t.scrollHeight > t.clientHeight + 1)) { f -= 0.5; t.style.fontSize = f + "px"; }
    }
  const gem = el.querySelector(".gem"), pw = el.querySelector(".power");
  if (pw) pw.style.fontSize = gem ? gem.style.fontSize : 3.2 * S + "px";
}
function unitCard(x) {
  if (x.id) return ROW[x.id];
  const k = x.tok.kinds[0];
  return { name: x.tok.name, race: TOKRACE[k] || "neutral", raceTh: k, arch: "", type: "โทเคน", cost: "", gem: "", power: String(x.tok.power), ability: "", art: null };
}

// ---------------------------------------------------------------- สถานะฝั่งหน้าจอ
// role: "bot" (เล่นกับบอท) | "host" (เจ้าของห้อง) | "guest" (เข้าห้องเพื่อน)
// เจ้าของห้อง/โหมดบอท: เกมรันใน Session บนเครื่องนี้ · ผู้เข้าห้อง: ได้แค่ view จากเจ้าของห้องแล้วส่งคำสั่งกลับไป
let role = null, S = null, peer = null, conn = null, V = null, pendingAsk = null, overShown = false;
let mode = "idle", sel = null, fodder = new Set(), toastTimer = 0;
const log = (s) => { const d = document.createElement("div"); if (s.startsWith("——")) d.className = "turn"; d.textContent = s; $("log").appendChild(d); $("log").scrollTop = 1e9; };
const toast = (s) => { $("msg").textContent = s; $("msg").className = "err"; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastTimer = 0; render(); }, 2500); };

function act(a) {
  mode = "idle"; sel = null; fodder = new Set();
  if (role === "guest") { if (conn && conn.open) conn.send({ type: "act", a }); else toast("ไม่ได้เชื่อมต่อกับห้อง"); }
  else S.act(0, a).then((err) => err && toast(err));
  render();
}
function setView(v) {
  V = v;
  if (!V.myTurn && mode !== "mull") { mode = "idle"; sel = null; fodder = new Set(); }
  if (mode === "attack" && !V.me.field.some((x) => x.uid === sel && !x.atkErr)) { mode = "idle"; sel = null; }
  render();
  if (V.phase === "over" && !overShown) { overShown = true; gameOver(); }
  if (window.AUTOPLAY) setTimeout(autoStep, 30);
}

function render() {
  if (!V) return;
  const hearts = (n) => "❤".repeat(Math.max(0, n)) + "♡".repeat(Math.max(0, Engine.HP - n));
  $("ename").textContent = V.opp.name; $("mname").textContent = V.me.name;
  $("ehp").textContent = hearts(V.opp.hp); $("mhp").textContent = hearts(V.me.hp);
  $("ehand").innerHTML = `<span class="back"></span>`.repeat(V.opp.handCount);
  for (const [side, d, g] of [[V.me, "mdeck", "mgrave"], [V.opp, "edeck", "egrave"]]) {
    $(d).textContent = `เดค ${side.deck}`; $(g).textContent = `สุสาน ${side.grave.length}`; $(g).title = side.grave.join("\n") || "ว่าง";
  }
  $("earch").textContent = V.opp.arch;
  $("minfo").textContent = `เทิร์น ${V.turn} · ${V.me.arch} · เวทปกติ ${V.me.spellUsed}/${V.me.spellMax}`;

  const attacker = mode === "attack" ? V.me.field.find((x) => x.uid === sel) : null;
  const targets = attacker ? attacker.targets : [];
  // สนามศัตรู (ตอนเลือกเป้า: ขึ้นผลที่คาดไว้บนเป้าแต่ละตัว)
  const ef = $("efield"); ef.innerHTML = "";
  for (const x of V.opp.field) {
    const hit = targets.includes(x.uid), st = hit ? [attacker.pred[x.uid], ...x.status] : x.status;
    const el = cardEl(unitCard(x), { powerNow: x.power, status: st, pred: hit, cls: hit ? "target" : "" });
    el.onclick = () => { if (hit) act({ t: "attack", uid: sel, target: x.uid }); };
    ef.appendChild(el);
  }
  for (let i = V.opp.field.length; i < Engine.FIELD; i++) ef.insertAdjacentHTML("beforeend", `<div class="slot"></div>`);
  $("eface").className = "face" + (targets.includes("face") ? " target" : "");
  // สนามเรา
  const mf = $("mfield"); mf.innerHTML = "";
  for (const x of V.me.field) {
    const cls = !V.myTurn ? "" : x.uid === sel && mode === "attack" ? "sel" : !x.atkErr ? "ready click" : "click";
    const el = cardEl(unitCard(x), { powerNow: x.power, status: x.status, cls });
    el.onclick = () => clickUnit(x); mf.appendChild(el);
  }
  for (let i = V.me.field.length; i < Engine.FIELD; i++) mf.insertAdjacentHTML("beforeend", `<div class="slot"></div>`);
  // มือ
  if (V.phase === "mull" && !V.mullDone && mode !== "mull") { mode = "mull"; fodder = new Set(); }
  if ((V.phase !== "mull" || V.mullDone) && mode === "mull") mode = "idle";
  const hand = $("mhand"); hand.innerHTML = "";
  V.me.hand.forEach((h, k) => {
    let cls = "";
    if (mode === "pay") cls = k === sel ? "sel" : fodder.has(k) ? "fodder click" : h.gem > 0 ? "click" : "dim";
    else if (mode === "mull") cls = fodder.has(k) ? "fodder click" : "click";
    else if (V.myTurn) cls = "click";
    if (h.dead) cls += " dead";
    const el = cardEl(ROW[h.id], { costNow: h.costNow, cls });
    el.onclick = () => clickHand(h, k); hand.appendChild(el);
  });
  // ปุ่มและข้อความ
  $("endturn").disabled = !V.myTurn || mode !== "idle";
  $("cancel").style.display = mode === "pay" || mode === "attack" ? "" : "none";
  if (mode === "pay") {
    const need = V.me.hand[sel].costNow, have = [...fodder].reduce((s, k) => s + V.me.hand[k].gem, 0);
    $("paybox").innerHTML = `gem ${have}/${need} <button class="main" id="dosum" ${have >= need ? "" : "disabled"}>อัญเชิญ</button>`;
    $("dosum").onclick = () => act({ t: "summon", k: sel, f: [...fodder] });
  } else if (mode === "mull") {
    $("paybox").innerHTML = `<button class="main" id="domull">${fodder.size ? `เปลี่ยน ${fodder.size} ใบ` : "เก็บทั้งมือ"}</button>`;
    $("domull").onclick = () => { const idx = [...fodder]; act({ t: "mull", idx }); };
  } else $("paybox").innerHTML = "";
  if (!toastTimer) {
    $("msg").className = "";
    $("msg").textContent =
      V.phase === "mull" ? (V.mullDone ? "รออีกฝ่ายเลือก mulligan…" : "เลือกการ์ดที่จะเปลี่ยน (mulligan) แล้วกดปุ่ม")
      : V.phase === "over" ? (V.winner === "me" ? "คุณชนะ!" : "คุณแพ้")
      : mode === "pay" ? `เลือกการ์ดที่จะทิ้งจ่าย gem ${V.me.hand[sel].costNow} (เลือกให้แล้วตามคำแนะนำ เปลี่ยนได้ · ทิ้งเกินได้)`
      : mode === "attack" ? `เลือกเป้าหมายของ ${attacker ? unitCard(attacker).name : ""}`
      : V.myTurn ? (V.turn === 1 ? "ตาคุณ (เทิร์นแรกของเกมโจมตีไม่ได้)" : "ตาคุณ")
      : `ตาของ ${V.whoseTurn}…`;
  }
}

function clickHand(h, k) {
  if (mode === "mull") { fodder.has(k) ? fodder.delete(k) : fodder.add(k); return render(); }
  if (mode === "pay") {
    if (k === sel) return;
    if (h.gem <= 0) return toast("การ์ดใบนี้ไม่มี gem");
    fodder.has(k) ? fodder.delete(k) : fodder.add(k); return render();
  }
  if (!V.myTurn || mode !== "idle") return;
  if (h.err) return toast(h.err);
  if (h.costNow == null) return act({ t: "cast", k });
  if (h.costNow === 0) return act({ t: "summon", k, f: [] });
  sel = k; fodder = new Set(h.auto); mode = "pay"; render();
}
function clickUnit(x) {
  if (!V.myTurn) return;
  if (mode === "attack" && x.uid === sel) { mode = "idle"; sel = null; return render(); }
  if (mode !== "idle" && mode !== "attack") return;
  if (x.atkErr) return toast(x.atkErr);
  sel = x.uid; mode = "attack"; render();
}
$("eface").onclick = () => { const a = mode === "attack" && V.me.field.find((x) => x.uid === sel); if (a && a.targets.includes("face")) act({ t: "attack", uid: sel, target: "face" }); };
$("cancel").onclick = () => { mode = "idle"; sel = null; fodder = new Set(); render(); };
$("endturn").onclick = () => { if (mode === "idle" && V.myTurn) act({ t: "end" }); };

// ฝ่ายรับเลือกตอบโต้: เวทสวน / พรีกายจากมือ → ตำแหน่งตัวเลือก หรือ null
function askModal(p) {
  if (window.AUTOPLAY) return Promise.resolve(p.opts.length && Math.random() < 0.6 ? 0 : null);
  return new Promise((resolve) => {
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<div class="box"><h2>${esc(p.head)}</h2><p class="muted">${esc(p.sub)}<br>ตอบโต้ได้ 1 ครั้งต่อเทิร์นของศัตรู</p>
      <div class="cards"></div><div class="btns"><button id="noreact">ไม่ตอบโต้</button></div></div>`;
    const box = m.querySelector(".cards");
    p.opts.forEach((o, i) => {
      const el = cardEl(ROW[o.id], { cls: "click" });
      el.title = o.kind === "counter" ? "ใช้เวทสวน" : "ทิ้งรับแทน";
      el.onclick = () => { m.remove(); resolve(i); }; box.appendChild(el);
    });
    m.querySelector("#noreact").onclick = () => { m.remove(); resolve(null); };
    document.body.appendChild(m);
  });
}
function gameOver() {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box"><h2>${V.winner === "me" ? "🏆 คุณชนะ!" : "💀 คุณแพ้"}</h2><p>จบที่เทิร์น ${V.turn}</p>
    <div class="btns"><button class="main" id="again">${role === "bot" ? "เล่นอีกครั้ง" : "กลับหน้าแรก"}</button><button id="stay">ดูกระดาน</button></div></div>`;
  m.querySelector("#again").onclick = () => { if (role === "bot") { m.remove(); $("setup").style.display = ""; } else location.href = location.pathname; };
  m.querySelector("#stay").onclick = () => m.remove();
  document.body.appendChild(m);
}
function notice(title, body) {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box"><h2>${esc(title)}</h2><p>${esc(body)}</p><div class="btns"><button class="main">กลับหน้าแรก</button></div></div>`;
  m.querySelector("button").onclick = () => (location.href = location.pathname);
  document.body.appendChild(m);
}

// ---------------------------------------------------------------- เริ่มเกม
function newSession(seats, names, decks, opts = {}) {
  overShown = false; $("log").innerHTML = ""; $("setup").style.display = "none";
  S = new Session({ cards: ALL, decks, names, seats, seed: Date.now() & 0x7fffffff,
    onView: (i, v) => { if (i === 0) setView(v); else if (conn && conn.open) conn.send({ type: "view", v }); },
    onLog: (s) => { log(s); if (conn && conn.open) conn.send({ type: "log", s }); },
    ask: (i, p) => (i === 0 ? askModal(p) : new Promise((res) => { pendingAsk = res; conn.send({ type: "ask", p }); })),
    ...opts });
  S.start();
}
const myName = () => $("myname").value.trim() || (role === "guest" ? "ผู้เล่น 2" : role === "host" ? "ผู้เล่น 1" : "คุณ");
const ARCHS = Engine.archetypes(ALL);
const RACEORDER = ["มนุษย์", "นรก", "สวรรค์", "ภูต", "สัตว์", "ไดโนเสาร์", "เครื่องจักร", "มังกร", "ปลา"];
ARCHS.sort((a, b) => RACEORDER.indexOf(a[1]) - RACEORDER.indexOf(b[1]));
for (const s of ["mydeck", "botdeck"])
  $(s).innerHTML = (s === "botdeck" ? `<option value="">สุ่ม</option>` : "") + ARCHS.map(([a, r]) => `<option value="${esc(a)}">${esc(r)} · ${esc(a)}</option>`).join("");
$("myname").value = store.get("name") || "";
if (store.get("deck")) $("mydeck").value = store.get("deck");
const remember = () => { store.set("name", $("myname").value.trim()); store.set("deck", $("mydeck").value); };
$("go").onclick = () => {
  role = "bot"; remember();
  const botArch = $("botdeck").value || ARCHS[Math.floor(Math.random() * ARCHS.length)][0];
  newSession(["local", "bot"], [myName(), "บอท"], [$("mydeck").value, botArch]);
};

// ---------------------------------------------------------------- ออนไลน์ (PeerJS: เชื่อมเครื่องตรงหากัน ไม่ต้องมีเซิร์ฟเวอร์ของเราเอง)
const netmsg = (s) => ($("netmsg").innerHTML = s);
function loadPeer() {
  if (window.Peer) return Promise.resolve();
  return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = PEERJS; s.onload = ok; s.onerror = () => bad(new Error("โหลด PeerJS ไม่ได้ (ต้องต่อเน็ต)")); document.head.appendChild(s); });
}
const newCode = () => Array.from({ length: 5 }, () => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random() * 32)]).join("");
const ARCHSET = new Set(ARCHS.map((a) => a[0]));

async function hostRoom() {
  role = "host"; remember();
  try { await loadPeer(); } catch (e) { peer = null; return netmsg(esc(e.message)); }
  const code = newCode();
  netmsg("กำลังสร้างห้อง…");
  peer = new Peer(PREFIX + code);
  peer.on("open", () => {
    const link = `${location.origin}${location.pathname}?room=${code}`;
    if (location.hash === "#nethost") parent.postMessage({ code }, "*");
    netmsg(`รหัสห้อง <span class="code">${code}</span><br>ส่งรหัสนี้ หรือลิงก์ <a href="${esc(link)}" style="color:var(--hi)">${esc(link)}</a> ให้เพื่อน · รอเพื่อนเข้าห้อง…`);
  });
  peer.on("error", (e) => { if (e.type === "unavailable-id") { peer.destroy(); hostRoom(); } else netmsg(`เชื่อมต่อไม่ได้: ${esc(e.type)}`); });
  peer.on("connection", (c) => {
    if (conn) { c.on("open", () => { c.send({ type: "full" }); setTimeout(() => c.close(), 500); }); return; }
    conn = c;
    c.on("data", (d) => {
      if (!d || typeof d !== "object") return;
      if (d.type === "hello" && !S) {
        const arch = ARCHSET.has(d.arch) ? d.arch : ARCHS[0][0], name = String(d.name || "ผู้เล่น 2").slice(0, 16);
        newSession(["local", "remote"], [myName(), name === myName() ? name + " (2)" : name], [$("mydeck").value, arch]);
      } else if (d.type === "act" && S) S.act(1, d.a).then((err) => err && c.send({ type: "err", s: err }));
      else if (d.type === "answer" && pendingAsk) { const r = pendingAsk; pendingAsk = null; r(d.k); }
    });
    c.on("close", () => { if (!S || S.phase !== "over") notice("เพื่อนออกจากห้อง", "การเชื่อมต่อหลุด เกมนี้จบแล้ว"); });
  });
}
async function joinRoom(code) {
  role = "guest"; remember();
  code = code.trim().toUpperCase();
  if (!/^[A-Z0-9]{5}$/.test(code)) { peer = null; return netmsg("รหัสห้องต้องมี 5 ตัว"); }
  try { await loadPeer(); } catch (e) { peer = null; return netmsg(esc(e.message)); }
  netmsg("กำลังเข้าห้อง…");
  peer = new Peer();
  peer.on("error", (e) => netmsg(e.type === "peer-unavailable" ? "ไม่พบห้องนี้ (รหัสผิด หรือเจ้าของห้องปิดไปแล้ว)" : `เชื่อมต่อไม่ได้: ${esc(e.type)}`));
  peer.on("open", () => {
    conn = peer.connect(PREFIX + code, { reliable: true });
    conn.on("open", () => { conn.send({ type: "hello", name: myName(), arch: $("mydeck").value }); netmsg("เข้าห้องแล้ว รอเจ้าของห้องเริ่ม…"); });
    conn.on("data", async (d) => {
      if (!d || typeof d !== "object") return;
      if (d.type === "view") { $("setup").style.display = "none"; setView(d.v); }
      else if (d.type === "log") log(String(d.s));
      else if (d.type === "err") toast(String(d.s));
      else if (d.type === "full") netmsg("ห้องนี้เต็มแล้ว");
      else if (d.type === "ask") { const k = await askModal(d.p); conn.send({ type: "answer", k }); }
    });
    conn.on("close", () => { if (!V || V.phase !== "over") notice("เจ้าของห้องออกจากห้อง", "การเชื่อมต่อหลุด เกมนี้จบแล้ว"); });
  });
}
$("host").onclick = () => { if (!peer) { peer = "starting"; hostRoom(); } };
$("join").onclick = () => { if (!peer) { peer = "starting"; joinRoom($("joincode").value); } };
const roomParam = new URLSearchParams(location.search).get("room");
if (roomParam) { $("joincode").value = roomParam.toUpperCase(); netmsg("ใส่ชื่อ เลือกเดค แล้วกด <b>เข้าห้อง</b>"); }

// ---------------------------------------------------------------- ทดสอบ
if (location.hash === "#demo") { $("go").click(); S.act(0, { t: "mull", idx: [] }); }   // เริ่มเกมกับบอททันที
if (location.hash === "#auto") {                                                      // บอทเล่นทั้งสองฝั่ง เพื่อดูว่าหน้าจอวาดทุกสถานะได้
  role = "bot"; newSession(["bot", "bot"], ["บอท A", "บอท B"], [ARCHS[0][0], ARCHS[20][0]], { watch: true, botDelay: 0 });
  const t = setInterval(() => { if (S.phase === "over") { clearInterval(t); console.log("AUTO_DONE turn", S.G.turn); } }, 200);
}
// #nethost / #netguest: ทดสอบออนไลน์จริง — สองหน้าต่างเล่นกันเองแบบสุ่มผ่าน PeerJS แล้วรายงานผลให้หน้าแม่
let autoBusy = false;
function autoStep() {
  if (!V || autoBusy) return;
  if (V.phase === "over") { parent.postMessage({ done: role, winner: V.winner, turn: V.turn, hp: [V.me.hp, V.opp.hp] }, "*"); return; }
  if (V.phase === "mull" && !V.mullDone) return act({ t: "mull", idx: [0] });
  if (!V.myTurn) return;
  const r = Math.random(), hand = V.me.hand.map((h, k) => [h, k]);
  const sum = hand.filter(([h]) => h.costNow != null && !h.err && (h.costNow === 0 || h.auto.length));
  const spells = hand.filter(([h]) => h.costNow == null && !h.err), atk = V.me.field.filter((x) => !x.atkErr);
  const one = (a) => a[Math.floor(Math.random() * a.length)];
  if (sum.length && r < 0.4) { const [h, k] = one(sum); act({ t: "summon", k, f: h.auto }); }
  else if (spells.length && r < 0.55) act({ t: "cast", k: one(spells)[1] });
  else if (atk.length && r < 0.92) { const x = one(atk); act({ t: "attack", uid: x.uid, target: one(x.targets) }); }
  else act({ t: "end" });
}
if (location.hash === "#nethost" || location.hash === "#netguest") {
  window.AUTOPLAY = true; $("myname").value = location.hash === "#nethost" ? "เจ้าของห้อง" : "เพื่อน";
  if (location.hash === "#nethost") $("host").click(); else $("join").click();
}
</script>
</body>
</html>
